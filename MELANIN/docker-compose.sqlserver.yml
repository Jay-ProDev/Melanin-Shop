services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -C -N
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # --- Admin (seeder) ---
      - MELANIN_ADMIN_PASSWORD=${MELANIN_ADMIN_PASSWORD}
      # --- Authentification JWT ---
      - Token__Key=${Token__Key}
      # --- Stripe ---
      - Stripe__SecretKey=${Stripe__SecretKey}
      - Stripe__WebhookSecret=${Stripe__WebhookSecret}
      # --- Mailer ---
      - Mailer__Password=${Mailer__Password}
      # --- Base de données (conteneur SQL Server "db") ---
      - DatabaseProvider=SqlServer
      - ConnectionStrings__SqlServer=Server=db;Database=MelaninDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True; 
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data: