<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bienvenue</title>
</head>
<body style="margin:0;padding:0;background:#f7f7f7;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:30px 0;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;">
                    <tr>
                        <td style="background:#8B4513;padding:24px 32px;">
                            <h1 style="margin:0;color:#ffffff;font-size:20px;font-weight:700;">Melanin Shop</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h2 style="margin:0 0 16px;color:#8B4513;font-size:18px;">Bienvenue, {{FirstName}} !</h2>
                            <p style="margin:0 0 12px;color:#333333;font-size:14px;line-height:1.6;">
                                Ton compte a bien été créé. Tu peux dès maintenant explorer notre boutique et découvrir nos produits.
                            </p>
                            <p style="margin:0;color:#333333;font-size:14px;line-height:1.6;">
                                Merci de nous faire confiance.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background:#f7f7f7;padding:16px 32px;">
                            <p style="margin:0;color:#888888;font-size:12px;">L'équipe Melanin Shop</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
